[build-system]
requires = ["hatchling>=1.25,<2.0"]
build-backend = "hatchling.build"

[project]
name = "breathe-transformers-paper"
version = "0.1.0"
description = "Code and model files for the transformer respiratory sound paper."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = "MIT"
authors = [
  { name = "Theodore Aptekarev" }
]
dependencies = [
  "accelerate>=1.3,<2.0",
  "einops>=0.8,<1.0",
  "hf-transfer>=0.1,<1.0",
  "matplotlib>=3.7,<4.0",
  "numpy>=1.22,<2.0",
  "pandas>=2.2,<3.0",
  "peft>=0.15,<1.0",
  "pillow>=10.3,<11.0",
  "pyyaml>=6.0,<7.0",
  "safetensors>=0.4,<1.0",
  "scikit-learn>=1.5,<2.0",
  "seaborn>=0.13,<1.0",
  "soundfile>=0.13,<1.0",
  "torch>=2.3,<3.0",
  "torchaudio>=2.6,<3.0",
  "torchvision>=0.21,<1.0",
  "tqdm>=4.66,<5.0",
  "transformers>=4.48,<5.0",
  "wandb>=0.19,<1.0",
]

[project.optional-dependencies]
cuda = [
  "bitsandbytes>=0.45,<1.0",
]
notebooks = [
  "ipykernel>=6.29,<7.0",
]

[tool.hatch.build.targets.wheel]
packages = ["breathe_transformers"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
extend-select = [
  "D",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[dependency-groups]
dev = [
    "pandas-stubs>=2.3.3.260113",
    "ruff>=0.15.14",
    "ty>=0.0.39",
]
